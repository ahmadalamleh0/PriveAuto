<!doctype html>
<html lang="en" class="intro-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Privé Auto</title>
    <meta name="description" content="Privé Auto: vehicle wraps, paint protection, ceramic coating, bespoke interiors and performance builds." />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Social previews (WhatsApp, Instagram DMs, Facebook, iMessage, X…).
         %SITE_URL% is filled at build time (vite.config.ts): Netlify's URL, or SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Privé Auto" />
    <meta property="og:title" content="Privé Auto" />
    <meta property="og:description" content="Privé Auto: vehicle wraps, paint protection, ceramic coating, bespoke interiors and performance builds." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg?v=20261109" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.jpg?v=20261109" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Privé Auto" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privé Auto" />
    <meta name="twitter:description" content="Privé Auto: vehicle wraps, paint protection, ceramic coating, bespoke interiors and performance builds." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg?v=20261109" />
    <meta name="twitter:image:alt" content="Privé Auto" />

    <!-- PLACEHOLDER icons and social image (typeset Privé Auto monogram/wordmark) until the real logo is supplied. ?v= busts browser icon caches on change -->
    <link rel="icon" href="/favicon.ico?v=20261109" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20261109" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=20261109" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261109" />
    <link rel="manifest" href="/site.webmanifest?v=20261109" />
    <link rel="preload" href="/fonts/michroma-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bruno-ace-sc-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Paint black before any CSS/JS arrives, so the intro starts from a clean black frame -->
    <style>html { background: #0b0b0c; }</style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: static copy of the build-request form so Netlify detects
         it at deploy time. The visible form is rendered by React and posts the
         same fields (src/lib/buildRequest.ts). -->
    <form name="build-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="make" /><input name="model" /><input name="year" />
      <input name="service" /><textarea name="details"></textarea>
      <input name="name" /><input name="email" /><input name="phone" />
      <input name="contact" /><input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
